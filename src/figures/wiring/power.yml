# Both power systems, battery to load.
# Build: just diagrams power
#
# Two independent batteries: the 6S pack feeds the computer and sensors
# through a 12 V DC-DC converter; the 2S pack feeds the drive. They share a
# ground at the Orin header (signal ground), not at the batteries.

metadata:
  title: AutoSDV, power distribution

options:
  fontname: DejaVu Sans
  bgcolor: WH
  color_mode: SHORT

connectors:
  BAT6S:
    type: 6S LiPo
    subtype: 22.2 V, upper power
    image:
      src: photos/battery-6s.jpg
    pinlabels: [+, '-']
    notes: Own cell monitor with alarm (JST-XH balance lead)
  UPSW:
    type: Upper power switch
    image:
      src: photos/upper-power-switch.jpg
    pinlabels: [in, out]
  DCDC:
    type: DC-DC converter
    subtype: 22.2 V to 12 V
    image:
      src: photos/dcdc-12v.jpg
    pinlabels: [IN+, IN-, OUT+, OUT-]
  ORIN:
    type: Jetson AGX Orin
    subtype: DC jack
    image:
      src: photos/orin.jpg
    pinlabels: [+12 V, GND]
  ZEDLINK:
    type: ZED Link capture card
    subtype: DC input; powers the ZED X Mini over GMSL2
    pinlabels: [+12 V, GND]
  LIDAR:
    type: LiDAR
    subtype: VLP-32C, Robin-W or Cube1
    image:
      src: photos/lidar.jpg
    pinlabels: [+12 V, GND]
  G5:
    type: 5G modem (optional)
    subtype: MOXA OnCell G4302, 12 V at 2 A
    pinlabels: [+12 V, GND]
  BAT2S:
    type: 2S LiPo
    subtype: 7.4 V, drive
    image:
      src: photos/battery-2s.jpg
    pinlabels: [+, '-']
    notes: Own cell monitor with alarm (JST-XH balance lead)
  PTSW:
    type: Powertrain switch
    image:
      src: photos/powertrain-switch.jpg
    pinlabels: [in, out]
  VESC:
    type: VESC
    subtype: battery input
    image:
      src: photos/vesc.jpg
    pinlabels: [BAT+, BAT-]
  PCA:
    type: PCA9685
    subtype: servo rail
    pinlabels: [V+, GND]
    notes: Feeds the steering servo's power pin
  RX:
    type: RC receiver
    subtype: 5 V rail
    image:
      src: photos/receiver.jpg
    pinlabels: [+5 V, GND]
    notes: Rail source to confirm on the car
  D1:
    type: 1N5819
    subtype: Schottky
    pinlabels: [A, K]
  ARB:
    type: Arbiter board
    subtype: XIAO RP2350, 5V pin
    pinlabels: [5V, GND]
    notes: |-
      About 4.7 V after the diode.
      Use a data-only USB cable to the Orin, so the receiver
      rail cannot back-feed the Orin's USB port.

cables:
  W_6S:
    category: bundle
    colors: [RD, BK]
    wirelabels: [22.2 V, GND]
  W_SW6:
    category: bundle
    colors: [RD]
    wirelabels: [22.2 V switched]
  W_12V:
    category: bundle
    colors: [RD, BK]
    wirelabels: [12 V, GND]
  W_2S:
    category: bundle
    colors: [RD, BK]
    wirelabels: [7.4 V, GND]
  W_5V:
    category: bundle
    colors: [RD, BK]
    wirelabels: [5 V, GND]
  W_D:
    category: bundle
    colors: [RD]
    wirelabels: [4.7 V]
  W_SW2:
    category: bundle
    colors: [RD]
    wirelabels: [7.4 V switched]

connections:
  - - BAT6S: [+]
    - W_SW6: [1]
    - UPSW: [in]
  - - UPSW: [out]
    - W_6S: [1]
    - DCDC: [IN+]
  - - BAT6S: ['-']
    - W_6S: [2]
    - DCDC: [IN-]
  - - DCDC: [OUT+, OUT-]
    - W_12V: [1-2]
    - ORIN: [+12 V, GND]
  - - DCDC: [OUT+, OUT-]
    - W_12V: [1-2]
    - ZEDLINK: [+12 V, GND]
  - - DCDC: [OUT+, OUT-]
    - W_12V: [1-2]
    - LIDAR: [+12 V, GND]
  - - DCDC: [OUT+, OUT-]
    - W_12V: [1-2]
    - G5: [+12 V, GND]
  - - BAT2S: [+]
    - W_SW2: [1]
    - PTSW: [in]
  - - PTSW: [out]
    - W_2S: [1]
    - VESC: [BAT+]
  - - BAT2S: ['-']
    - W_2S: [2]
    - VESC: [BAT-]
  - - PTSW: [out]
    - W_2S: [1]
    - PCA: [V+]
  - - BAT2S: ['-']
    - W_2S: [2]
    - PCA: [GND]
  - - RX: [+5 V]
    - W_5V: [1]
    - D1: [A]
  - - D1: [K]
    - W_D: [1]
    - ARB: [5V]
  - - RX: [GND]
    - W_5V: [2]
    - ARB: [GND]
