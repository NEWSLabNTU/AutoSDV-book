name: Deploy Release Docs

# Triggered by version tags: X.Y-N
# X.Y = AutoSDV version, N = book revision
# e.g. 0.1-1, 0.1-2, 0.2-1
on:
  push:
    tags:
      - '[0-9]+.[0-9]+-[0-9]+'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 0.1-2 → 0.1
          AUTOSDV_VERSION="${TAG%-*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$AUTOSDV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy versioned docs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          mike deploy --push --update-aliases \
            "$VERSION" latest \
            --title "$VERSION ($TAG)"
          mike set-default --push latest

      - name: Create deployment summary
        run: |
          echo "### Documentation Deployed ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AutoSDV version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Alias**: latest" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://NEWSLabNTU.github.io/AutoSDV-book/${{ steps.version.outputs.version }}/" >> $GITHUB_STEP_SUMMARY

  update-website:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUTOSDV_BOOK_DEPLOY_KEY }}

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: NEWSLabNTU/NEWSLabNTU.github.io
          ssh-key: ${{ secrets.AUTOSDV_BOOK_DEPLOY_KEY }}
          path: website

      - name: Update submodule
        working-directory: ./website
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git submodule update --init --recursive -- autosdv-book
          cd autosdv-book
          git fetch origin gh-pages
          git checkout gh-pages
          cd ..

          git add autosdv-book
          git commit -m "Update autosdv-book to ${{ github.ref_name }}" || echo "No changes to commit"
          git push

      - name: Update summary
        run: |
          echo "### Website Updated ✓" >> $GITHUB_STEP_SUMMARY
          echo "- **Website**: https://NEWSLabNTU.github.io/" >> $GITHUB_STEP_SUMMARY
